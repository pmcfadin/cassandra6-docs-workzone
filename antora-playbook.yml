# Antora playbook for Cassandra 6 Docs Workzone
# This builds a local preview of draft documentation.
# It is NOT the official Cassandra docs build.
#
# Usage:
#   npx antora antora-playbook.yml
#
# Output: build/site/

site:
  title: 'Apache Cassandra 6 Docs — Preview'
  # site.url is required for Antora to emit 404.html and sitemap.xml
  # (the smoke suite asserts the 404 page exists). Points at the GitHub
  # Pages deployment; local preview is unaffected (only canonical links,
  # sitemap, and 404 asset prefixes use it).
  url: https://pmcfadin.github.io/cassandra6-docs-workzone
  start_page: home::index.adoc

content:
  sources:
    - url: .
      start_path: content/home
      branches: HEAD
    - url: .
      start_path: content/operators
      branches: HEAD
    - url: .
      start_path: content/developers
      branches: HEAD
    - url: .
      start_path: content/contributors
      branches: HEAD
    - url: .
      start_path: content/reference
      branches: HEAD
    # Upstream Apache Cassandra trunk docs — local clone, antora.yml generated by gen-antora-yml.py
    # (antora.yml is not committed to cassandra repo; generated here for local workzone builds)
    - url: ./cassandra
      start_path: doc
      branches: HEAD

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: ./build/site

runtime:
  fetch: true
